description: |
  Output-only GPIO controller of the Fri3d Badge 2026 IO expander. Pin N is
  bit N of the expander output register (0x16), the level is the level of
  the coprocessor pin:

    0: AUX 3V3 rail enable (high = on)
    1: LCD and touch reset (low = in reset, use GPIO_ACTIVE_LOW)
    4: LoRa module reset (low = in reset, use GPIO_ACTIVE_LOW)

  Pins 2 (reboot coprocessor to bootloader) and 3 (remap I2C to SWD) are
  commands, not GPIOs, and are rejected.

compatible: "fri3d,badge-2026-expander-gpio"

include: gpio-controller.yaml

properties:
  "#gpio-cells":
    const: 2

gpio-cells:
  - pin
  - flags
