[env]
platform = ch32v
framework = noneos-sdk
upload_protocol = isp
board = genericCH32X035G8U6
;turn off the compilation of the built-in debug implementation
board_build.use_builtin_debug_code = no
;extra_scripts =
;    pre:git_version.py

[env:debug]
build_flags = ${env.build_flags} -DDEBUG -DVERSION_MAJOR=\"255\" -DVERSION_MINOR=\"255\" -DVERSION_PATCH=\"255\"

[env:release]
